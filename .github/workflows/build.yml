name: Build GRP

# Builds a single portable executable for Windows and macOS via PyInstaller.
# Added 2026-08-08 -- PyInstaller can't cross-compile (a build run on macOS
# only produces a macOS binary), so this uses GitHub's own windows-latest and
# macos-latest runners to build each platform's binary natively, without
# needing a real Windows machine.
#
# Runs on every push to main (for quick build-health feedback) and on
# version tags (v*), where it also attaches both binaries to a GitHub
# Release. Push a tag to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: guildrun-run-parser.exe
            asset_name: guildrun-run-parser-windows.exe
          - os: macos-latest
            artifact_name: guildrun-run-parser
            asset_name: guildrun-run-parser-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --onefile --name guildrun-run-parser guildrun_state_watcher.py

      - name: Rename for upload
        shell: bash
        run: cp "dist/${{ matrix.artifact_name }}" "${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
